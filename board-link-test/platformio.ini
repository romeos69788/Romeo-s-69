; Alpha ↔ Beta UART relay walk test
[platformio]
default_envs = alpha_cmd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:alpha_cmd]
upload_port = COM7
monitor_port = COM7
build_src_filter = +<alpha/>

[env:beta_relay]
; Μετακίνησε το USB στη Beta πριν το upload (θύρα μπορεί να μείνει COM7)
upload_port = COM7
monitor_port = COM7
build_src_filter = +<beta/>
