; JC1060P470C_I_W_Y (ESP32-P4 · 1024×600) — letterbox host for romeos-display-v10 UI
; Factory backup: ../Othoni Levita/JC1060P470C_I_W_Y/factory_flash_backup/

[platformio]
default_envs = JC1060_P4
src_dir = src

[env:JC1060_P4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.flash_size = 16MB
board_build.partitions = partitions_14MB_factory.csv
upload_port = COM14
upload_speed = 921600
monitor_port = COM14
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    lvgl/lvgl@8.4.0
board_build.embed_files =
    data/img_1.bin
    data/img_2.bin
    data/img_3.bin
    data/img_4.bin
    data/img_5.bin
    data/img_6.bin
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -I include
    -I src
    -I src/ui
    -I src/bsp/lcd
    -I src/bsp/touch
build_src_filter =
    +<*>
    +<ui/*>
    +<bsp/lcd/*>
    +<bsp/touch/*>
